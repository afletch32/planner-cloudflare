name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-workflow:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  syntax-check:
    name: JavaScript Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check services and scripts
        run: |
          find services storage db scripts workers/assets/src -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) -print0 | xargs -0 -n1 node --check
      - name: Check public JS files
        run: |
          find public -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) -print0 | xargs -0 -n1 node --check
